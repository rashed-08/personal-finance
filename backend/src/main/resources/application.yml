spring:

  application:
    name: Personal Finance

  profiles:
    active: local

  banner:
    location: classpath:banner.txt

server:
  port: 8080

app:
  # Base URL used in emailed links (verification, password reset).
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  mail:
    from: ${MAIL_FROM:noreply@personal-finance.local}

  security:
    # Set to true behind HTTPS in production.
    cookie-secure: ${COOKIE_SECURE:false}
    jwt:
      # HMAC-SHA256 key, at least 32 bytes. No default on purpose:
      # each environment must provide its own (local profile has a dev-only value).
      secret: ${JWT_SECRET:}
      issuer: personal-finance
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
    google:
      # OAuth 2.0 Web client ID from Google Cloud Console.
      # Google Sign-In is disabled while this is blank.
      client-id: ${GOOGLE_CLIENT_ID:}
    tokens:
      email-verification-ttl: ${EMAIL_VERIFICATION_TTL:24h}
      password-reset-ttl: ${PASSWORD_RESET_TTL:1h}