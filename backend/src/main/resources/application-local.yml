spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/personal_finance
    username: postgres
    password: postgres

  flyway:
    enabled: true

  # Mailpit from infra/compose.yaml — web UI at http://localhost:8025
  mail:
    host: localhost
    port: 1025

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

app:
  security:
    jwt:
      # Dev-only key for the local profile. Never use outside local development.
      secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-0123456789}